name: Temporary candidate-order audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full-corpus audit
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > /tmp/audit_candidate_order.py
          python /tmp/audit_candidate_order.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-order-audit
          path: candidate_order_audit/
          retention-days: 1
